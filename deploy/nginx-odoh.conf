# ODoH target vhost — PUBLIC on purpose. Clients arrive through third-party
# relays, so access logs would only ever contain relay IPs; keep logging off
# anyway: a privacy service should not collect what it does not need.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name odoh.example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log off;

    location / {
        proxy_pass http://127.0.0.1:8054;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
}
