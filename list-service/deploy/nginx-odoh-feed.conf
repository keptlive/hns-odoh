# Serve the ODoH feed as a static asset -- a location snippet to add to an
# existing server block. It is public, cacheable, and CORS so a browser (any
# origin) can fetch it.
#
# The feed is built only from lists whose minisign signatures verified, but the
# feed itself is not signed: a client trusts it as far as it trusts this host
# and TLS.

location = /.well-known/odoh-feed.json {
    alias /var/www/html/.well-known/odoh-feed.json;
    default_type application/json;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "public, max-age=3600" always;
    # A public trust asset: keep it outside any auth.
    auth_basic off;
}
