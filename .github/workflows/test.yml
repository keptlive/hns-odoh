name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
        working-directory: client
      - run: node --test odoh.test.js
        working-directory: client
      - run: python -m pip install cryptography
      - run: python -m unittest test_odoh_list_service -v
        working-directory: list-service
